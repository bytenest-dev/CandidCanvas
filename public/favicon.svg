<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" fill="none">
  <!-- Circular clip -->
  <defs>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>
  <!-- White circle background -->
  <circle cx="32" cy="32" r="32" fill="#ffffff"/>
  <!-- Logo image clipped to circle -->
  <image href="/logo.png" x="0" y="0" width="64" height="64" clip-path="url(#circle)" preserveAspectRatio="xMidYMid meet"/>
</svg>
